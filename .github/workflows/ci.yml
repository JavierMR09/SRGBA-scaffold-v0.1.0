name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SRGBA
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure core and tests
        run: >-
          cmake -S . -B build/core
          -DCMAKE_BUILD_TYPE=Debug
          -DSRGBA_BUILD_APP=OFF
          -DSRGBA_BUILD_TESTS=ON
          -DSRGBA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/core --parallel

      - name: Fetch public test ROMs
        # jsmolka/gba-tests (MIT), pinned for reproducible results.
        working-directory: ${{ runner.temp }}
        run: |
          git init gba-tests
          git -C gba-tests fetch --depth 1 https://github.com/jsmolka/gba-tests.git a7113b67e63f83a9b321696ddd7042ccfad6c881
          git -C gba-tests checkout FETCH_HEAD

      - name: Test
        env:
          SRGBA_GBA_TESTS_DIR: ${{ runner.temp }}/gba-tests
        run: ctest --test-dir build/core --output-on-failure

  windows-app:
    name: Windows application and package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SRGBA
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build/windows -A x64
          -DSRGBA_BUILD_APP=ON
          -DSRGBA_BUILD_TESTS=ON
          -DSRGBA_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface compiler diagnostics as annotations so they are visible without the raw log.
            Select-String -Path build.log -Pattern ': (fatal error|error|warning) [A-Z]+[0-9]+' |
              Select-Object -First 40 |
              ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            # Summarize the failures in one annotation (GitHub keeps only a few per step).
            $lines = Select-String -Path test.log -Context 0,2 -Pattern '(FAILED|\*\*\*Failed|Exception|exception|with expansion)' |
              Select-Object -First 40 |
              ForEach-Object { @($_.Line.Trim()) + $_.Context.PostContext.Trim() }
            Write-Output ("::error title=Test failures::" + (($lines | Where-Object { $_ }) -join '%0A'))
            exit 1
          }

      - name: Package portable ZIP
        run: cpack --config build/windows/CPackConfig.cmake -C Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SRGBA-windows-x64
          path: SRGBA/build/windows/packages/SRGBA-*.zip
          if-no-files-found: error

