name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Publish Windows portable ZIP
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build/windows -A x64
          -DSRGBA_BUILD_APP=ON
          -DSRGBA_BUILD_TESTS=ON
          -DSRGBA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/windows --config Release --parallel

      - name: Test
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Package
        run: cpack --config build/windows/CPackConfig.cmake -C Release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem "build/windows/packages/SRGBA-*.zip" | Select-Object -First 1
          if (-not $asset) { throw "SRGBA package was not produced." }
          gh release create $env:GITHUB_REF_NAME $asset.FullName --generate-notes --title "SRGBA $env:GITHUB_REF_NAME"

